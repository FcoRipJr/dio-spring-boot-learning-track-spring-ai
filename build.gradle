plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id("io.freefair.lombok") version "9.2.0"

}

group = 'dio'
version = '0.0.1-SNAPSHOT'
description = 'budgeting'

java {
    toolchain {
        // Projeto original usava Java 25; ajustado para o JDK 21 instalado na maquina
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation platform("org.springframework.ai:spring-ai-bom:2.0.0-M4")
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    implementation 'org.springframework.boot:spring-boot-starter-web'

    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
}

tasks.named('test') {
    useJUnitPlatform()
}

// --- Workaround: Windows + caminho com acento (ex.: "Java com Inteligência Artificial") ---
// O Gradle passa o classpath do worker de testes num arquivo de argumentos gravado em UTF-8,
// mas o java.exe le esse arquivo no encoding nativo do Windows (Cp1252): o "ê" vira "Ãª"
// e as classes de teste nao sao encontradas (ClassNotFoundException).
// Solucao: um "pathing jar" (manifest com o classpath em formato URL, acentos codificados),
// gravado numa pasta temporaria sem acento. So e ativado quando o problema pode ocorrer.
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def hasNonAsciiPath = !(projectDir.absolutePath ==~ /\p{ASCII}*/)

if (isWindows && hasNonAsciiPath) {
    def testPathingJar = tasks.register('testPathingJar', Jar) {
        archiveFileName = "${rootProject.name}-test-pathing.jar"
        destinationDirectory.fileValue(new File(System.getProperty('java.io.tmpdir'), 'gradle-pathing-jars'))
        def runtimeClasspath = sourceSets.test.runtimeClasspath
        inputs.files(runtimeClasspath)
        doFirst {
            manifest.attributes('Class-Path': runtimeClasspath.files.collect { file ->
                def uri = file.toURI().toASCIIString()
                (!file.name.endsWith('.jar') && !uri.endsWith('/')) ? uri + '/' : uri
            }.join(' '))
        }
    }

    tasks.named('test') {
        dependsOn testPathingJar
        // O Gradle precisa enxergar os jars do JUnit Platform diretamente no classpath da task
        classpath = files(testPathingJar) + sourceSets.test.runtimeClasspath.filter { file ->
            ['junit-', 'opentest4j', 'apiguardian'].any { file.name.startsWith(it) }
        }
    }
}
